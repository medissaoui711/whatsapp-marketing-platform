version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: saas-postgres-prod
    environment:
      POSTGRES_USER: ${PROD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PROD_DB_NAME:-saas_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas-redis-prod
    command: redis-server --appendonly yes --requirepass ${PROD_REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: saas-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
    container_name: saas-web-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PROD_DB_USER:-postgres}:${PROD_DB_PASSWORD:-postgres}@postgres:5432/${PROD_DB_NAME:-saas_platform}
      REDIS_URL: redis://:${PROD_REDIS_PASSWORD:-redis123}@redis:6379
      JWT_ACCESS_SECRET: ${PROD_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${PROD_JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${PROD_ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${PROD_APP_URL}
      NEXT_PUBLIC_WS_URL: ${PROD_WS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: saas-worker-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PROD_DB_USER:-postgres}:${PROD_DB_PASSWORD:-postgres}@postgres:5432/${PROD_DB_NAME:-saas_platform}
      REDIS_URL: redis://:${PROD_REDIS_PASSWORD:-redis123}@redis:6379
      JWT_ACCESS_SECRET: ${PROD_JWT_ACCESS_SECRET}
      ENCRYPTION_KEY: ${PROD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: saas-cloudflare-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - saas-network
    restart: unless-stopped

networks:
  saas-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
