list:
  get:
    summary: List webhooks
    description: Returns all registered webhooks for the organization.
    tags:
      - Webhooks
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Webhook list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../openapi.yaml#/components/schemas/Webhook'

  post:
    summary: Create webhook
    description: Register a new webhook endpoint.
    tags:
      - Webhooks
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/WebhookCreate'
    responses:
      '201':
        description: Webhook created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../openapi.yaml#/components/schemas/Webhook'

single:
  get:
    summary: Get webhook
    description: Returns a single webhook by ID.
    tags:
      - Webhooks
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/WebhookIdParam'
    responses:
      '200':
        description: Webhook details
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../openapi.yaml#/components/schemas/Webhook'
      '404':
        description: Webhook not found
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

  put:
    summary: Update webhook
    description: Update an existing webhook configuration.
    tags:
      - Webhooks
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/WebhookIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/WebhookUpdate'
    responses:
      '200':
        description: Webhook updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../openapi.yaml#/components/schemas/Webhook'
      '404':
        description: Webhook not found
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

  delete:
    summary: Delete webhook
    description: Permanently delete a webhook.
    tags:
      - Webhooks
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/WebhookIdParam'
    responses:
      '200':
        description: Webhook deleted successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
      '404':
        description: Webhook not found
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
